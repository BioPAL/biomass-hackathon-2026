# Apply the group label chosen in the Task issue form or PR template.
# Runs with GITHUB_TOKEN so reporters do not need Triage rights.
name: Label group from form

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply group label from issue or PR body
        uses: actions/github-script@v7
        with:
          script: |
            const ALLOWED = new Set([
              '02-RFI',
              '03-QGIS',
              '04-3D-TOMO-CANOPY-VISUALIZER',
              '05-BIOMASS&GEDI',
              '06A-CARBON',
              '06B-CARBON',
              '07-GEOLOGY',
              '08-ICE-QUEEN',
              '09-BIODIVERSITY',
              '10-TOMO-SAR-FOREST-HEIGHT',
              '11-A-SOIL-MOISTURE',
              '11-B-FLOODED-FOREST',
            ]);

            const isPR = !!context.payload.pull_request;
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const body = item.body || '';

            // Issue forms: ### Group\n\n02-RFI
            // PR template: ## Group\n\n03-QGIS
            const match = body.match(
              /#{2,3}\s*(?:Group|Proposing group)\s*\r?\n+([^\r\n]+)/i
            );
            if (!match) {
              core.info('No Group / Proposing group section found; skipping.');
              return;
            }

            const group = match[1].trim().replace(/^`+|`+$/g, '');
            if (!ALLOWED.has(group)) {
              core.warning(`Group value "${group}" is not an allowed label; skipping.`);
              return;
            }

            const issue_number = item.number;
            const { owner, repo } = context.repo;

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
            });
            const toRemove = current
              .map((l) => l.name)
              .filter((name) => ALLOWED.has(name) && name !== group);

            for (const name of toRemove) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name,
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [group],
            });

            core.info(`Applied group label ${group} on ${isPR ? 'PR' : 'issue'} #${issue_number}.`);
