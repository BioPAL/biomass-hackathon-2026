name: "Task · my group"
description: Work that lives in your group folder. One issue per task (S/M/L up to 3 hours).
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        **Where:** your group folder under `topics/`.

        Your **group label** is applied automatically from the Group field below.
        Search existing issues first to avoid duplicates.
        You do not need to assign yourself to work on the issue (open a PR with `Closes #N`).
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: A GitHub Action applies this as a colored label on the issue.
      options:
        - "02-RFI"
        - "03-QGIS"
        - "04-3D-TOMO-CANOPY-VISUALIZER"
        - "05_BIOMASS_AND_GEDI"
        - "06A-CARBON"
        - "06B-CARBON"
        - "07-GEOLOGY"
        - "08-ICE-QUEEN"
        - "09-BIODIVERSITY"
        - "10-TOMO-SAR-FOREST-HEIGHT"
        - "11-A-SOIL-MOISTURE"
        - "11-B-FLOODED-FOREST"
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Checkable result (how do we know this issue is finished?)
      placeholder: e.g. Notebook cell loads the sample L2 product into xarray on MAAP
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Pick S, M, or L. If the work needs more than 3 hours, split it into several issues.
      options:
        - "S (≤ 1 hour)"
        - "M (≤ 2 hours)"
        - "L (≤ 3 hours)"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 - blocking the group"
        - "P1 - needed soon"
        - "P2 - nice to have"
    validations:
      required: true
  - type: input
    id: blocked_by
    attributes:
      label: Blocked by
      description: Issue number if any, otherwise leave empty
      placeholder: e.g. #12
  - type: textarea
    id: notes
    attributes:
      label: Notes / approach
      description: Optional short plan
      placeholder: e.g. start from the group README and add a notebook
