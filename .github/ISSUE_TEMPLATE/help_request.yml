name: "Help wanted (Git or technical)"
description: Ask us for help. No question is too basic.
title: "[Help] "
labels: ["help wanted"]
body:
  - type: dropdown
    id: group
    attributes:
      label: Group (leave as "Not group-specific" if it's a general Git question)
      options:
        - "Not group-specific"
        - "02-RFI"
        - "03-QGIS"
        - "04-3D-TOMO-CANOPY-VISUALIZER"
        - "05-BIOMASS&GEDI"
        - "06A-CARBON"
        - "06B-CARBON"
        - "07-GEOLOGY"
        - "08-ICE-QUEEN"
        - "09-BIODIVERSITY"
        - "10-TOMO-SAR-FOREST-HEIGHT"
        - "11-A-SOIL-MOISTURE"
        - "11-B-FLOODED-FOREST"
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - "Low, can wait"
        - "Medium, blocking my progress"
        - "High, blocking the whole group"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
