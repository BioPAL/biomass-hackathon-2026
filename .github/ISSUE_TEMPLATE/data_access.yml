name: "Data access request"
description: Ask for access to a dataset needed for your topic
title: "[Data] "
labels: ["data-access"]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - "01 - PolSAR and PolInSAR Analytics"
        - "02 - RFI removal"
        - "03 - QGIS plugin"
        - "04 - 3D forest structure visualisation"
        - "05 - BIOMASS and GEDI intercomparison"
        - "06 - BIOMASS validation"
        - "07 - BIOMASS for Geology"
        - "08 - BIOMASS for Cryosphere"
        - "11 - BIOMASS for biodiversity"
        - "12 - Forest Height from TomoSAR"
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset name / description
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where should it live? (MAAP collection, external link, etc.)
  - type: textarea
    id: why
    attributes:
      label: What do you need it for?
