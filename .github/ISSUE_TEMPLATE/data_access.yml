name: "Data access request"
description: Ask for access to a dataset needed for your topic
title: "[Data] "
labels: ["data-access"]
body:
  - type: dropdown
    id: group
    attributes:
      label: Group
      options:
        - "02-RFI"
        - "03-QGIS"
        - "04-3D-TOMO-CANOPY-VISUALIZER"
        - "05-BIOMASS&GEDI"
        - "06A-CARBON"
        - "06B-CARBON"
        - "07-GEOLOGY"
        - "08-ICE-QUEEN"
        - "09-BIODIVERSITY"
        - "10-TOMO-SAR-FOREST-HEIGHT"
        - "11-A-SOIL-MOISTURE"
        - "11-B-FLOODED-FOREST"
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset name / description
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where should it live? (MAAP collection, external link, etc.)
  - type: textarea
    id: why
    attributes:
      label: What do you need it for?
