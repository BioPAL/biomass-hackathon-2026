name: "Project group check-in"
description: Post a progress update for your hackathon project group
title: "[Check-in] "
labels: ["check-in"]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - "01 - PolSAR and PolInSAR Analytics"
        - "02 - RFI removal"
        - "03 - QGIS plugin"
        - "04 - 3D forest structure visualisation"
        - "05 - BIOMASS and GEDI intercomparison"
        - "06 - BIOMASS validation"
        - "07 - BIOMASS for Geology"
        - "08 - BIOMASS for Cryosphere"
        - "11 - BIOMASS for biodiversity"
        - "12 - Forest Height from TomoSAR"
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: What did you do?
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blockers / help needed
  - type: textarea
    id: next
    attributes:
      label: Next steps
