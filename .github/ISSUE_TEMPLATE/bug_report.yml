name: "Bug report"
description: Something in the shared repo / resources is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: Where? (file or folder path)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
