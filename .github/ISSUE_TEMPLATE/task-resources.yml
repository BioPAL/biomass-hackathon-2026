name: "Task · resources (shared)"
description: Shared helper in resources/ for several groups (S/M/L up to 3 hours).
title: "[Task][resources] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        **Where:** `resources/` (load / process / evaluate / plot).

        Use this only if **another group** will reuse the code.
        After submit: add your **group label**, **assign yourself**, avoid duplicates.
  - type: dropdown
    id: group
    attributes:
      label: Proposing group
      description: Also apply this as a GitHub label on the issue after creation.
      options:
        - "02-RFI"
        - "03-QGIS"
        - "04-3D-TOMO-CANOPY-VISUALIZER"
        - "05-BIOMASS&GEDI"
        - "06A-CARBON"
        - "06B-CARBON"
        - "07-GEOLOGY"
        - "08-ICE-QUEEN"
        - "09-BIODIVERSITY"
        - "10-TOMO-SAR-FOREST-HEIGHT"
        - "11-A-SOIL-MOISTURE"
        - "11-B-FLOODED-FOREST"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: resources/ layer
      options:
        - "load"
        - "process"
        - "evaluate"
        - "plot"
        - "tests"
        - "not sure yet"
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Checkable result
      placeholder: e.g. function load_l2(path) returns an xarray Dataset and has a short docstring
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Pick S, M, or L. If the work needs more than 3 hours, split it into several issues.
      options:
        - "S (≤ 1 hour)"
        - "M (≤ 2 hours)"
        - "L (≤ 3 hours)"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 - blocking the group"
        - "P1 - needed soon"
        - "P2 - nice to have"
    validations:
      required: true
  - type: textarea
    id: who_reuses
    attributes:
      label: Who else will use this?
      description: Other groups / use cases
    validations:
      required: true
