[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomass"
version = "0.1.0"
description = "Search and download ESA Biomass, NASA NISAR and Copernicus Sentinel-1/2 products"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "pystac-client",
    "tqdm",
]

[project.optional-dependencies]
geo = ["geopandas", "folium", "rasterio", "fsspec", "aiohttp", "matplotlib", "h5py"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
