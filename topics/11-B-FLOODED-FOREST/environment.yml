# Flooded-forest pipeline environment: BPS + PolSARpro + pipeline dependencies.
#   conda env create -f environment.yml
#   conda activate flooded-forest
name: flooded-forest
channels:
  - biomass-bps       # ESA BIOMASS Processing Suite (BPS)
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # BPS: optional at runtime, the MBMP coherence is cross-checked against
  # bps main_correlation_estimation_SR when it is importable
  - bps-transcoder
  - bps-l2a_processor
  # PolSARpro (Python re-implementation): S -> T3, Pauli RGB, H/A/alpha
  - polsarpro
  - xarray
  - dask>=2024
  # pipeline
  - numpy
  - scipy
  - requests
  - pyyaml
  - pystac-client
  - rasterio
  - shapely>=2
  - netcdf4
  - folium
  - matplotlib
  - pillow
  # tools/ only
  - geopandas
  - plotly
