<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-labelledby="title desc">
  <title id="title">BIOMASS Hackathon live contribution dashboard</title>
  <desc id="desc">Open the live board for issues closed, PRs merged, and group races</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="55%" stop-color="#152433"/>
      <stop offset="100%" stop-color="#0c141c"/>
    </linearGradient>
    <radialGradient id="glowCy" cx="18%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00b6f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00b6f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGr" cx="88%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#97c00b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#97c00b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b6f0"/>
      <stop offset="100%" stop-color="#007a94"/>
    </linearGradient>
  </defs>

  <rect width="880" height="168" rx="18" fill="url(#bg)"/>
  <rect width="880" height="168" rx="18" fill="url(#glowCy)"/>
  <rect width="880" height="168" rx="18" fill="url(#glowGr)"/>
  <rect x="1" y="1" width="878" height="166" rx="17" fill="none" stroke="rgba(0,182,240,0.28)" stroke-width="1.5"/>

  <!-- radar motif -->
  <g transform="translate(78,84)" opacity="0.9">
    <circle r="52" fill="none" stroke="#00b6f0" stroke-opacity="0.22" stroke-width="1.2"/>
    <circle r="34" fill="none" stroke="#00b6f0" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle r="16" fill="none" stroke="#97c00b" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M0 0 L46 -18" stroke="#00b6f0" stroke-width="2" stroke-linecap="round"/>
    <circle r="4" fill="#97c00b"/>
    <circle r="2.2" fill="#0f1923"/>
  </g>

  <text x="160" y="58" fill="#9bb0c0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">ESA BIOMASS MAAP HACKATHON 2026</text>
  <text x="160" y="92" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700">Live contribution dashboard</text>
  <text x="160" y="120" fill="#9bb0c0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15">Issues closed · PRs merged · group races · refreshed on merge</text>

  <g transform="translate(668,58)">
    <rect width="172" height="52" rx="26" fill="url(#cta)"/>
    <text x="86" y="32" text-anchor="middle" fill="#0f1923" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">Open live board ’</text>
  </g>
</svg>
